version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      dependencies:
        patterns: ['*']
    ignore:
      # Vite 8 (rolldown) breaks WXT 0.21's config loader: "Class extends value undefined",
      # reported as "Builder not found. Make sure vite is installed."
      - dependency-name: vite
        update-types: [version-update:semver-major]
      # eslint-plugin-jsx-a11y doesn't support ESLint 10 yet, so npm fails with ERESOLVE.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
      # typescript-eslint 8 peers on typescript <6.1.0, so TypeScript 7 fails npm ci with
      # ERESOLVE. Drop this once typescript-eslint supports it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /telemetry-worker
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      telemetry-worker:
        patterns: ['*']
    ignore:
      # Vite 8's native rolldown binding fails to install alongside vitest here; stay on 7 to
      # match the extension.
      - dependency-name: vite
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
