name: CI

on:
  # Every PR, not just those into main, so stacked branches are checked too.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  build:
    name: Build (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run zip -- -b ${{ matrix.browser }}
      - name: Lint Firefox build (addons-linter)
        if: matrix.browser == 'firefox'
        run: npm run lint:firefox
      - uses: actions/upload-artifact@v7
        with:
          name: lander-ntp-${{ matrix.browser }}
          path: .output/*.zip
          if-no-files-found: error
          # WXT's output dir is dot-prefixed, which upload-artifact skips by default.
          include-hidden-files: true

  worker:
    name: Telemetry Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telemetry-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: telemetry-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Bundles and checks the bindings in wrangler.jsonc without deploying or logging in.
      - run: npx wrangler deploy --dry-run --outdir dist
