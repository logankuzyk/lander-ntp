name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    steps:
      # Keeps a release PR open that bumps package.json (the only source of the manifest
      # version) and writes CHANGELOG.md. Merging it tags vX.Y.Z and publishes a GitHub
      # release, which is what triggers publish.yml.
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
