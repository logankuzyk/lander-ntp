name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check store authentication without uploading anything
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Build and submit
    runs-on: ubuntu-latest
    # Gated on a required reviewer, and holds the store credentials.
    environment: store-publish
    # Job-wide so the credential check and the submission itself read the same values.
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
      CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
      FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Also builds the Firefox sources zip that AMO review needs.
      - run: npm run zip:all

      # Every run keeps the zips, so a manual run is a way to get installable builds
      # without any store credentials set up.
      - name: Upload the zips as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ntp-zips
          path: .output/*.zip
          if-no-files-found: error
          # WXT's output dir is dot-prefixed, which upload-artifact skips by default.
          include-hidden-files: true

      - name: Attach the zips to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" .output/*.zip --clobber

      # Each store is opt-in: one with no secrets is skipped, so until any exist this
      # workflow is just a builder. A half-filled set is treated as a mistake rather than a
      # reason to skip, so a typo in one secret name can't quietly drop a store from a release.
      #
      # A store is also skipped when it already has this version or a newer one live, which
      # makes a re-run safe after one store failed. The live version comes from the public
      # listing, so a version still waiting on review doesn't count. Edge has no such lookup
      # without a second ID, so it's submitted whenever it's configured.
      - name: Submit to the stores
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail

          version=$(node -p "require('./package.json').version")

          # configured <store> <secret names…>
          configured() {
            local store=$1 missing=() name
            shift
            for name in "$@"; do
              [ -n "${!name:-}" ] || missing+=("$name")
            done
            [ "${#missing[@]}" -gt 0 ] || return 0
            if [ "${#missing[@]}" -lt "$#" ]; then
              echo "::error::$store credentials are only partially configured. Missing: ${missing[*]}"
              exit 1
            fi
            echo "::notice::No $store credentials configured, so it was skipped."
            return 1
          }

          # outdated <store> <live version>
          outdated() {
            local store=$1 live=$2
            if [ -z "$live" ]; then
              echo "::error::Couldn't read the live $store version."
              exit 1
            fi
            # A dry run only checks authentication, so it goes ahead whatever is live.
            [ "$DRY_RUN" != "true" ] || return 0
            if [ "$version" != "$live" ] &&
              [ "$(printf '%s\n' "$version" "$live" | sort -V | tail -n 1)" = "$version" ]; then
              return 0
            fi
            echo "::notice::$store already has $live live, so $version was not submitted."
            return 1
          }

          args=()

          if configured Chrome CHROME_EXTENSION_ID CHROME_PUBLISHER_ID CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL CHROME_SERVICE_ACCOUNT_PRIVATE_KEY; then
            # The update check Chrome itself polls; the store API only reports drafts.
            live=$(
              curl -fsS "https://clients2.google.com/service/update2/crx?response=updatecheck&acceptformat=crx3&prodversion=140.0&x=id%3D${CHROME_EXTENSION_ID}%26uc" |
                sed -n 's/.*<updatecheck[^>]* version="\([^"]*\)".*/\1/p'
            )
            if outdated Chrome "$live"; then
              args+=(
                --chrome-zip .output/*-chrome.zip
                # v1.1, the default, stops working on 15 October 2026.
                --chrome-api-version v2
                --chrome-extension-id "$CHROME_EXTENSION_ID"
                --chrome-publisher-id "$CHROME_PUBLISHER_ID"
                --chrome-service-account-client-email "$CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL"
                --chrome-service-account-private-key "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY"
              )
            fi
          fi

          if configured Firefox FIREFOX_EXTENSION_ID FIREFOX_JWT_ISSUER FIREFOX_JWT_SECRET; then
            live=$(
              curl -fsS "https://addons.mozilla.org/api/v5/addons/addon/${FIREFOX_EXTENSION_ID}/" |
                jq -r '.current_version.version // empty'
            )
            if outdated Firefox "$live"; then
              args+=(
                --firefox-zip .output/*-firefox.zip
                --firefox-sources-zip .output/*-sources.zip
                --firefox-extension-id "$FIREFOX_EXTENSION_ID"
                --firefox-jwt-issuer "$FIREFOX_JWT_ISSUER"
                --firefox-jwt-secret "$FIREFOX_JWT_SECRET"
              )
            fi
          fi

          if configured Edge EDGE_PRODUCT_ID EDGE_CLIENT_ID EDGE_API_KEY; then
            args+=(
              --edge-zip .output/*-edge.zip
              --edge-product-id "$EDGE_PRODUCT_ID"
              --edge-client-id "$EDGE_CLIENT_ID"
              --edge-api-key "$EDGE_API_KEY"
            )
          fi

          if [ "${#args[@]}" -eq 0 ]; then
            echo '::notice::Nothing was submitted. The zips are attached to this run.'
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi

          npx wxt submit "${args[@]}"
