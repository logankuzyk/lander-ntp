name: Chromatic

# Publishes Storybook so every PR and phase branch has a link to look at. Publish only: the
# preview turns snapshots off, so no visual tests run.
on:
  # Every PR, not just those into main, so stacked branches get a link too.
  pull_request:
  push:
    branches: [main, 'phase/**']

concurrency:
  group: chromatic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromatic:
    name: Publish Storybook
    runs-on: ubuntu-latest
    # Forks and Dependabot get no secrets, so skip them rather than fail. Pushes always run.
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7
        with:
          # Chromatic reads the git history to tell what changed.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: storybook:build
